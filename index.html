<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glory Player</title>
<style>
  :root {
    --bg-outer: #030711;
    --bg-main: #06122b;
    --bg-box: #081533;
    --bg-row: #0b1b3d;
    --bg-folder: #0e234f;
    --bg-root-folder: #132d63;
    --bg-bookmark: #0d1d42;
    --bg-hover: #173575;
    --bg-active: #c41224;
    --border: #d4af6a;
    --border-row: #284b8f;
    --text-main: #ffffff;
    --text-muted: #e2e8f0;
    --accent: #0c1d42;
    --btn-bg: #0c1d42;
    --btn-action-bg: #14264f;
    --seek-accent: #ef4444;
    --danger: #a80d1e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    background: var(--bg-outer);
    color: var(--text-main);
    height: 100vh;
    display: flex;
    justify-content: center;
    overflow: hidden;
    user-select: none;
  }

  .phone-shell {
    width: 100%;
    max-width: 460px;
    height: 100vh;
    background-color: var(--bg-main);
    border-left: 3px solid var(--border);
    border-right: 3px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  .flag-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    display: block;
  }

  header, .transport, .tree-window { contain: content; will-change: scroll-position; contain: content; will-change: scroll-position;
    position: relative;
    z-index: 1;
  }

  header {
    background: transparent;
    padding: 10px 10px 8px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 8px;
    align-items: stretch;
    flex-shrink: 0;
  }

  .brand {
    background: var(--bg-box);
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 76px;
    cursor: pointer;
    position: relative;
    box-shadow: none;
  }
  .brand:hover { background: var(--bg-hover); }

  .brand-title {
    font-size: 20px;
    font-weight: 800;
    line-height: 1.15;
    text-align: left;
    white-space: nowrap;
  }

  .brand-thumb {
    width: 40px;
    height: 40px;
    object-fit: cover;
    object-position: 28% 35%;
    border-radius: 5px;
    border: 1px solid var(--border);
    flex-shrink: 0;
    display: block;
  }

  .header-stack {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 6px;
    min-width: 0;
    height: 76px;
  }

  .header-stack select,
  .header-stack button {
    width: 100%;
    height: 35px;
    padding: 2px 6px;
    font-size: 14px;
  }

  #themeSelect {
    text-align: center;
    text-align-last: center;
  }

  .open-folder-tall {
    height: 76px;
    padding: 6px 10px;
    font-size: 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
  }

  button, select {
    background: var(--btn-bg);
    color: var(--text-main);
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 7px 9px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: none;
  }
  button:hover, select:hover { background: var(--bg-hover); }

  .btn-primary {
    background: var(--accent);
    border-color: var(--border);
    color: #ffffff;
  }
  .btn-primary:hover { background: var(--bg-hover); }

  .transport {
    background: transparent;
    padding: 4px 10px 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex-shrink: 0;
  }

  .now-playing {
    background: var(--bg-box);
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 18px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: none;
  }

  .transport-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .transport-btn {
    height: 48px;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 0 6px;
  }

  .btn-recording {
    background: #dc2626 !important;
    border-color: #ffffff !important;
    animation: pulseRec 1.1s infinite;
  }

  @keyframes pulseRec {
    0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.85); }
    50% { box-shadow: 0 0 12px 4px rgba(239, 68, 68, 0.9); }
  }

  .btn-delete-active {
    background: var(--danger);
    border-color: #fca5a5;
  }

  .seek-row {
    background: var(--bg-box);
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    font-weight: 700;
    font-family: Consolas, monospace;
    box-shadow: none;
  }

  input[type="range"] {
    flex: 1;
    height: 12px;
    cursor: pointer;
    accent-color: var(--seek-accent);
  }

  .tree-window { contain: content; will-change: scroll-position; contain: content; will-change: scroll-position;
    flex: 1;
    overflow-y: auto;
    padding: 6px 10px 24px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .tree-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 11px 10px;
    background: var(--bg-row);
    border: 2px solid var(--border-row);
    border-radius: 8px;
    cursor: pointer;
    box-shadow: none;
  }

  .tree-row.folder-row {
    background: var(--bg-folder);
    border-color: var(--border);
  }

  .tree-row.root-stack-row {
    background: var(--bg-root-folder);
    border-width: 2px;
    border-color: var(--border);
  }

  .tree-row.bookmark-item-row {
    background: var(--bg-bookmark);
    border-color: var(--border);
  }

  .tree-row:hover { background: var(--bg-hover); }

  .tree-row.playing {
    background: var(--bg-active);
    border-color: #ffffff;
    font-weight: 700;
  }

  .row-left {
    display: flex;
    align-items: center;
    gap: 8px;
    overflow: hidden;
    flex: 1;
  }

  .twisty {
    width: 18px;
    text-align: center;
    font-size: 15px;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  .item-icon {
    font-size: 25px;
    flex-shrink: 0;
  }

  .item-label {
    font-size: 20px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .bookmark-meta {
    font-size: 15px;
    font-weight: 700;
    color: #f3d28f;
    font-family: Consolas, monospace;
    flex-shrink: 0;
  }

  .folder-label { font-weight: 700; }

  .row-action-btn {
    background: var(--btn-action-bg);
    border: 2px solid var(--border);
    color: var(--text-main);
    padding: 6px 10px;
    font-size: 16px;
    flex-shrink: 0;
    box-shadow: none;
  }
  .row-action-btn:hover {
    background: var(--danger);
    border-color: #ffffff;
    color: #fff;
  }

  .modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.82);
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-backdrop.open { display: flex; }

  .tip-card {
    width: 100%;
    max-width: 390px;
    background: var(--bg-box);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    text-align: center;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.9);
  }

  .tip-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
  }

  .tip-card-title {
    font-size: 20px;
    font-weight: 800;
    color: #f3d28f;
  }

  .tip-close-btn {
    padding: 4px 10px;
    font-size: 16px;
  }

  .tip-desc {
    font-size: 16px;
    line-height: 1.45;
    color: var(--text-main);
  }

  .qr-box {
    background: #ffffff;
    padding: 12px;
    border-radius: 8px;
    border: 2px solid var(--border);
    width: 184px;
    height: 184px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .tip-method-block {
    background: var(--bg-row);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .tip-url-text {
    font-family: Consolas, monospace;
    font-size: 14px;
    color: #f3d28f;
    word-break: break-all;
  }

  .tip-btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .tip-btn-row button {
    font-size: 15px;
    padding: 8px 6px;
  }

  .empty-state {
    margin: 14px 2px;
    padding: 26px 18px;
    background: var(--bg-box);
    border: 2px solid var(--border);
    border-radius: 8px;
    text-align: center;
    font-size: 19px;
    color: var(--text-main);
    line-height: 1.6;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.8);
  }
</style>
<style>
  #gp-web-banner {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 99999;
    background: #14264f;
    color: #ffffff;
    border-bottom: 1px solid #284b8f;
    padding: 8px 14px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    font-size: 13px;
  }
  #gp-web-banner a {
    color: #ffffff;
    text-decoration: none;
    background: #0c1d42;
    border: 1px solid #284b8f;
    padding: 5px 10px;
    border-radius: 4px;
    font-weight: 600;
  }
  #gp-web-banner a.gp-dl {
    background: #a80d1e;
    border-color: #ef4444;
  }
  body {
    padding-top: 44px;
  }
</style>

// Standards-compliant ISO/IEC 18004 QR Code Encoder (Zero External Libraries)
function renderScannableQR(text) {
  // Reed-Solomon GF(256) helpers
  const EXP = new Uint8Array(512), LOG = new Uint8Array(256);
  for (let i = 0, x = 1; i < 255; i++) {
    EXP[i] = EXP[i + 255] = x;
    LOG[x] = i;
    x = (x << 1) ^ (x & 128 ? 0x11d : 0);
  }
  const gfMul = (a, b) => (a && b) ? EXP[LOG[a] + LOG[b]] : 0;

  function rsGenerator(ecLen) {
    let g = [1];
    for (let i = 0; i < ecLen; i++) {
      const next = new Array(g.length + 1).fill(0);
      for (let j = 0; j < g.length; j++) {
        next[j] ^= g[j];
        next[j + 1] ^= gfMul(g[j], EXP[i]);
      }
      g = next;
    }
    return g;
  }

  function rsEncode(data, ecLen) {
    const gen = rsGenerator(ecLen);
    const rem = new Array(ecLen).fill(0);
    for (const byte of data) {
      const factor = byte ^ rem.shift();
      rem.push(0);
      for (let i = 0; i < ecLen; i++) rem[i] ^= gfMul(gen[i + 1], factor);
    }
    return rem;
  }

  // Version 3-L (29x29, 55 data codewords, 15 EC codewords) holds up to 53 byte-mode chars
  const ver = 3, size = 29, dataCap = 55, ecLen = 15;
  const bytes = Array.from(new TextEncoder().encode(text));
  const bits = [];
  const pushBits = (val, len) => {
    for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1);
  };
  pushBits(0b0100, 4); // Byte mode
  pushBits(bytes.length, 8);
  for (const b of bytes) pushBits(b, 8);
  pushBits(0, Math.min(4, dataCap * 8 - bits.length));
  while (bits.length % 8 !== 0) bits.push(0);
  const padBytes = [0xec, 0x11];
  let padIdx = 0;
  while (bits.length < dataCap * 8) {
    pushBits(padBytes[padIdx % 2], 8);
    padIdx++;
  }

  const dataWords = [];
  for (let i = 0; i < bits.length; i += 8) {
    let w = 0;
    for (let b = 0; b < 8; b++) w = (w << 1) | bits[i + b];
    dataWords.push(w);
  }
  const allCodewords = dataWords.concat(rsEncode(dataWords, ecLen));

  const mod = Array.from({ length: size }, () => Array(size).fill(null));
  const isFunc = Array.from({ length: size }, () => Array(size).fill(false));

  function setFunc(x, y, val) {
    if (x >= 0 && x < size && y >= 0 && y < size) {
      mod[y][x] = val ? 1 : 0;
      isFunc[y][x] = true;
    }
  }

  function placeFinder(ox, oy) {
    for (let dy = -1; dy <= 7; dy++) {
      for (let dx = -1; dx <= 7; dx++) {
        const inBox = dx >= 0 && dx <= 6 && dy >= 0 && dy <= 6;
        const dark = inBox && (dx === 0 || dx === 6 || dy === 0 || dy === 6 || (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4));
        setFunc(ox + dx, oy + dy, dark);
      }
    }
  }
  placeFinder(0, 0);
  placeFinder(size - 7, 0);
  placeFinder(0, size - 7);

  // Version 3 alignment pattern at (22, 22)
  for (let dy = -2; dy <= 2; dy++) {
    for (let dx = -2; dx <= 2; dx++) {
      const dark = Math.max(Math.abs(dx), Math.abs(dy)) !== 1;
      setFunc(22 + dx, 22 + dy, dark);
    }
  }

  // Timing patterns & dark module
  for (let i = 8; i < size - 8; i++) {
    setFunc(i, 6, i % 2 === 0);
    setFunc(6, i, i % 2 === 0);
  }
  setFunc(8, size - 8, true);

  // Reserve format info areas
  for (let i = 0; i < 9; i++) {
    if (i !== 6) { setFunc(8, i, false); setFunc(i, 8, false); }
  }
  for (let i = 0; i < 8; i++) {
    setFunc(size - 1 - i, 8, false);
    if (i < 7) setFunc(8, size - 1 - i, false);
  }

  // Place data bits (mask 0: (x + y) % 2 === 0)
  const bitStream = [];
  for (const cw of allCodewords) {
    for (let b = 7; b >= 0; b--) bitStream.push((cw >>> b) & 1);
  }

  let bitIdx = 0, dirUp = true;
  for (let right = size - 1; right >= 1; right -= 2) {
    if (right === 6) right = 5;
    for (let step = 0; step < size; step++) {
      const y = dirUp ? (size - 1 - step) : step;
      for (let colOff = 0; colOff < 2; colOff++) {
        const x = right - colOff;
        if (!isFunc[y][x]) {
          const bit = bitIdx < bitStream.length ? bitStream[bitIdx++] : 0;
          const mask = ((x + y) % 2 === 0) ? 1 : 0;
          mod[y][x] = bit ^ mask;
        }
      }
    }
    dirUp = !dirUp;
  }

  // Format bits for EC Level L (01), Mask 0 (000) -> 0x77C4
  const fmt = 0x77c4;
  for (let i = 0; i < 15; i++) {
    const bit = (fmt >>> i) & 1;
    if (i < 6) mod[8][i] = bit;
    else if (i < 8) mod[8][i + 1] = bit;
    else mod[size - 15 + i][8] = bit;

    if (i < 8) mod[8][size - 1 - i] = bit;
    else if (i < 9) mod[15 - i][8] = bit;
    else mod[14 - i][8] = bit;
  }

  let rects = "";
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      if (mod[y][x] === 1) {
        rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="#000000"/>`;
      }
    }
  }
  document.getElementById("qrContainer").innerHTML =
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" width="156" height="156" shape-rendering="crispEdges">${rects}</svg>`;
}

function starPolygon(cx, cy, rOuter, rInner, points = 5) {
  let pts = [];
  const totalVerts = points * 2;
  for (let i = 0; i < totalVerts; i++) {
    const angle = (Math.PI / points) * i - Math.PI / 2;
    const r = i % 2 === 0 ? rOuter : rInner;
    pts.push(`${(cx + r * Math.cos(angle)).toFixed(1)},${(cy + r * Math.sin(angle)).toFixed(1)}`);
  }
  return pts.join(" ");
}

function wavingHStripes(colors, heights = null) {
  const total = heights ? heights.reduce((a, b) => a + b, 0) : colors.length;
  let y = 0;
  let out = `<rect width="460" height="900" fill="${colors[colors.length - 1]}"/>`;
  for (let i = 0; i < colors.length; i++) {
    const h = (900 * (heights ? heights[i] : 1)) / total;
    const yTop = y;
    const yBot = y + h + 2;
    if (i === 0) {
      out += `<path d="M0,0 L460,0 L460,${yBot - 8} Q345,${yBot + 14} 230,${yBot + 4} T0,${yBot - 6} Z" fill="${colors[i]}"/>`;
    } else if (i < colors.length - 1) {
      out += `<path d="M0,${yTop - 6} Q115,${yTop - 26} 230,${yTop + 4} T460,${yTop - 8} L460,${yBot - 8} Q345,${yBot + 14} 230,${yBot + 4} T0,${yBot - 6} Z" fill="${colors[i]}"/>`;
    }
    y += h;
  }
  return out;
}

function wavingVStripes(colors, widths = null) {
  const total = widths ? widths.reduce((a, b) => a + b, 0) : colors.length;
  let x = 0;
  let out = `<rect width="460" height="900" fill="${colors[0]}"/>`;
  for (let i = 0; i < colors.length - 1; i++) {
    x += (460 * (widths ? widths[i] : 1)) / total;
    out += `<path d="M${x},0 L460,0 L460,900 L${x},900 Q${x - 36},675 ${x - 10},450 T${x},0 Z" fill="${colors[i + 1]}"/>`;
  }
  return out;
}

    flagCanvas.style.display = "none";

}

document.getElementById("openFolderBtn").addEventListener("click", async () => {
  if (!window.showDirectoryPicker) {
    alert("Direct folder access requires Vivaldi, Chrome, Edge, or Brave.");
    return;
  }
  try {
    const dirHandle = await window.showDirectoryPicker({ mode: "readwrite" });

    let existingIdx = -1;
    for (let i = 0; i < folderStack.length; i++) {
      if (await folderStack[i].handle.isSameEntry(dirHandle)) {
        existingIdx = i;
        break;
      }
    }

    if (existingIdx !== -1) {
      const [existingNode] = folderStack.splice(existingIdx, 1);
      existingNode.expanded = false;
      folderStack.unshift(existingNode);
      selectedFolderNode = existingNode;
      renderUnifiedTree();
      return;
    }

    const newRootNode = {
      name: dirHandle.name,
      handle: dirHandle,
      parentNode: null,
      expanded: false,
      loaded: false,
      subfolders: [],
      files: []
    };

    folderStack.unshift(newRootNode);
    selectedFolderNode = newRootNode;
    renderUnifiedTree();
  } catch (err) {
    if (err.name !== "AbortError") {
      alert("Could not open folder: " + err.message);
    }
  }
});

async function loadFolderContents(node) {
  
  const dirs = [];
  const files = [];

  for await (const [name, handle] of node.handle.entries()) {
    if (handle.kind === "directory") {
      dirs.push({
        name,
        handle,
        parentNode: node,
        expanded: false,
        loaded: false,
        subfolders: [],
        files: []
      });
    } else if (handle.kind === "file") {
      const ext = name.split(".").pop().toLowerCase();
      if (AUDIO_EXTS.has(ext)) {
        files.push({
          name,
          handle,
          parentNode: node
        });
      }
    }
  }

  dirs.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));

  node.subfolders = dirs;
  node.files = files;
  node.loaded = true;
}

function renderUnifiedTree() {
  treeWindow.innerHTML = "";

  if (voiceStack.length === 0 && folderStack.length === 0) {
    return;
  }

  voiceStack.forEach((voiceObj, idx) => {
    const fileRow = document.createElement("div");
    const isPlaying = activeTrackHandle === voiceObj.handle;
    fileRow.className = "tree-row root-stack-row" + (isPlaying ? " playing" : "");
    fileRow.style.paddingLeft = "10px";

    const fLeft = document.createElement("div");
    fLeft.className = "row-left";

    const fIcon = document.createElement("span");
    fIcon.className = "item-icon";
    fIcon.textContent = isPlaying ? "🔊" : "🎙️";

    const fLabel = document.createElement("span");
    fLabel.className = "item-label folder-label";
    fLabel.textContent = voiceObj.name;

    fLeft.append(fIcon, fLabel);

    const delBtn = document.createElement("button");
    delBtn.className = "row-action-btn";
    delBtn.textContent = "🗑";
    delBtn.title = "Delete voice recording from disk";
    delBtn.onclick = async (e) => {
      e.stopPropagation();
      const confirmed = confirm("REALLY, DELETE?");
      if (!confirmed) return;
      try {
        if (activeTrackHandle === voiceObj.handle) {
          stopPlayback();
          audio.removeAttribute("src");
          activeTrackHandle = null;
          activeTrackIndex = -1;
          nowPlaying.textContent = "Deleted: " + voiceObj.name;
        }
        await voiceObj.parentNode.handle.removeEntry(voiceObj.name);
        voiceStack.splice(idx, 1);
        renderUnifiedTree();
      } catch (err) {
        alert("Could not delete recording: " + err.message);
      }
    };

    fileRow.onclick = () => {
      activePlaylist = voiceStack;
      playTrackFromPlaylist(idx);
    };

    fileRow.append(fLeft, delBtn);
    treeWindow.appendChild(fileRow);
  });

  for (const stackRoot of folderStack) {
    renderNodeRecursive(stackRoot, 0);
  }
}

function renderNodeRecursive(node, depth) {
  const indent = 10 + depth * 22;

  const folderRow = document.createElement("div");
  folderRow.className = "tree-row folder-row" + (depth === 0 ? " root-stack-row" : "");
  folderRow.style.paddingLeft = indent + "px";

  const left = document.createElement("div");
  left.className = "row-left";

  const twisty = document.createElement("span");
  twisty.className = "twisty";
  twisty.textContent = node.expanded ? "▼" : "▶";

  const icon = document.createElement("span");
  icon.className = "item-icon";
  icon.textContent = node.expanded ? "📂" : "📁";

  const label = document.createElement("span");
  label.className = "item-label folder-label";
  label.textContent = node.name;

  left.append(twisty, icon, label);
  folderRow.appendChild(left);

  if (node.parentNode) {
    const delFolderBtn = document.createElement("button");
    delFolderBtn.className = "row-action-btn";
    delFolderBtn.textContent = "🗑";
    delFolderBtn.title = "Delete entire subfolder from disk";
    delFolderBtn.onclick = (e) => {
      e.stopPropagation();
      deleteFolder(node);
    };
    folderRow.appendChild(delFolderBtn);
  } else {
    const closeStackBtn = document.createElement("button");
    closeStackBtn.className = "row-action-btn";
    closeStackBtn.textContent = "✖";
    closeStackBtn.title = "Close folder from stack (keeps files on disk)";
    closeStackBtn.onclick = (e) => {
      e.stopPropagation();
      closeStackedRoot(node);
    };
    folderRow.appendChild(closeStackBtn);
  }

  folderRow.onclick = async () => {
    selectedFolderNode = node;
    node.expanded = !node.expanded;
    if (node.expanded) {
      await loadFolderContents(node);
    }
    renderUnifiedTree();
  };

  treeWindow.appendChild(folderRow);

  if (node.expanded) {
    for (const sub of node.subfolders) {
      renderNodeRecursive(sub, depth + 1);
    }

    const folderFileNames = new Set(node.files.map((f) => f.name));
    const folderBookmarks = bookmarks.filter(
      (bm) =>
        (bm.folderName === node.name && folderFileNames.has(bm.trackName)) ||
        (!bm.folderName && folderFileNames.has(bm.trackName))
    );

    folderBookmarks.forEach((bm) => {
      const bmRow = document.createElement("div");
      bmRow.className = "tree-row bookmark-item-row";
      bmRow.style.paddingLeft = (indent + 24) + "px";

      const bLeft = document.createElement("div");
      bLeft.className = "row-left";

      const bIcon = document.createElement("span");
      bIcon.className = "item-icon";
      bIcon.textContent = "🔖";

      const bLabel = document.createElement("span");
      bLabel.className = "item-label";
      bLabel.textContent = bm.trackName;

      const bMeta = document.createElement("span");
      bMeta.className = "bookmark-meta";
      bMeta.textContent = bm.timeFormatted;

      bLeft.append(bIcon, bLabel, bMeta);

      const delBmBtn = document.createElement("button");
      delBmBtn.className = "row-action-btn";
      delBmBtn.textContent = "🗑";
      delBmBtn.title = "Remove bookmark";
      delBmBtn.onclick = (e) => {
        e.stopPropagation();
        const bmIdx = bookmarks.findIndex((item) => item.id === bm.id);
        if (bmIdx !== -1) {
          bookmarks.splice(bmIdx, 1);
          saveBookmarks();
          renderUnifiedTree();
        }
      };

      bmRow.onclick = () => jumpToBookmarkInFolder(node, bm);
      bmRow.append(bLeft, delBmBtn);
      treeWindow.appendChild(bmRow);
    });

    node.files.forEach((fileObj, idx) => {
      const fileRow = document.createElement("div");
      const isPlaying = activeTrackHandle === fileObj.handle;
      fileRow.className = "tree-row" + (isPlaying ? " playing" : "");
      fileRow.style.paddingLeft = (indent + 24) + "px";

      const fLeft = document.createElement("div");
      fLeft.className = "row-left";

      const fIcon = document.createElement("span");
      fIcon.className = "item-icon";
      fIcon.textContent = isPlaying ? "🔊" : "🎵";

      const fLabel = document.createElement("span");
      fLabel.className = "item-label";
      fLabel.textContent = fileObj.name;

      fLeft.append(fIcon, fLabel);

      const delBtn = document.createElement("button");
      delBtn.className = "row-action-btn";
      delBtn.textContent = "🗑";
      delBtn.title = "Delete file from disk";
      delBtn.onclick = (e) => {
        e.stopPropagation();
        deleteFile(node, idx);
      };

      fileRow.onclick = () => {
        selectedFolderNode = node;
        activePlaylist = node.files;
        playTrackFromPlaylist(idx);
      };

      fileRow.append(fLeft, delBtn);
      treeWindow.appendChild(fileRow);
    });
  }
}

function closeStackedRoot(stackNode) {
  const idx = folderStack.indexOf(stackNode);
  if (idx !== -1) {
    folderStack.splice(idx, 1);
  }
  if (selectedFolderNode && isDescendantOrSelf(stackNode, selectedFolderNode)) {
    selectedFolderNode = folderStack[0] || null;
  }
  renderUnifiedTree();
}

function isDescendantOrSelf(targetFolder, candidateFolder) {
  let curr = candidateFolder;
  while (curr) {
    if (curr === targetFolder) return true;
    curr = curr.parentNode;
  }
  return false;
}

async function deleteFolder(folderNode) {
  if (!folderNode.parentNode) return;

  const confirmed = confirm(
    `Permanently delete the entire folder "${folderNode.name}" and ALL files inside it?`
  );
  if (!confirmed) return;

  try {
    if (activeTrackIndex >= 0 && activePlaylist[activeTrackIndex]) {
      const playingFolder = activePlaylist[activeTrackIndex].parentNode;
      if (isDescendantOrSelf(folderNode, playingFolder)) {
        stopPlayback();
        audio.removeAttribute("src");
        activePlaylist = [];
        activeTrackIndex = -1;
        activeTrackHandle = null;
        nowPlaying.textContent = "Deleted folder: " + folderNode.name;
      }
    }

    if (selectedFolderNode && isDescendantOrSelf(folderNode, selectedFolderNode)) {
      selectedFolderNode = folderNode.parentNode;
    }

    await folderNode.parentNode.handle.removeEntry(folderNode.name, { recursive: true });

    const siblings = folderNode.parentNode.subfolders;
    const idx = siblings.indexOf(folderNode);
    if (idx !== -1) siblings.splice(idx, 1);

    renderUnifiedTree();
  } catch (err) {
    alert("Could not delete folder: " + err.message);
  }
}

async function playTrackFromPlaylist(idx, startAtSec = 0) {
  if (window.playTrackFromPlaylist && window.playTrackFromPlaylist !== playTrackFromPlaylist) return window.playTrackFromPlaylist(idx, startAtSec);
  if (idx < 0 || idx >= activePlaylist.length) return;
  activeTrackIndex = idx;
  const track = activePlaylist[idx];
  activeTrackHandle = track.handle;

  if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
  const file = await track.handle.getFile();
  currentObjectUrl = URL.createObjectURL(file);

  audio.src = currentObjectUrl;
  if (startAtSec > 0) {
    audio.addEventListener("loadedmetadata", function seekOnce() {
      audio.currentTime = Math.min(startAtSec, audio.duration || startAtSec);
      audio.removeEventListener("loadedmetadata", seekOnce);
    });
  }
  await audio.play();
  nowPlaying.textContent = "Playing: " + track.name;
  renderUnifiedTree();
}

async function deleteFile(folderNode, idx) {
  const track = folderNode.files[idx];
  if (!track) return;

  const confirmed = confirm("REALLY, DELETE?");
  if (!confirmed) return;

  try {
    const wasPlaying = activeTrackHandle === track.handle;
    if (wasPlaying) {
      stopPlayback();
      audio.removeAttribute("src");
      activeTrackHandle = null;
      activeTrackIndex = -1;
      nowPlaying.textContent = "Deleted: " + track.name;
    }

    await folderNode.handle.removeEntry(track.name);
    folderNode.files.splice(idx, 1);

    bookmarks = bookmarks.filter(
      (bm) => !(bm.trackName === track.name && bm.folderName === folderNode.name)
    );
    saveBookmarks();

    if (!wasPlaying && activePlaylist === folderNode.files && activeTrackIndex > idx) {
      activeTrackIndex--;
    }
    renderUnifiedTree();
  } catch (err) {
    alert("Could not delete file: " + err.message);
  }
}

function stopPlayback() {
  audio.pause();
  audio.currentTime = 0;
  seekBar.value = 0;
  currentTimeEl.textContent = "00:00";
  updatePlayPauseButton();
  if (activeTrackIndex >= 0 && activePlaylist[activeTrackIndex]) {
    nowPlaying.textContent = "Stopped: " + activePlaylist[activeTrackIndex].name;
  }
}

playPauseBtn.onclick = () => {
  if (audio.src) {
    if (audio.paused) {
      audio.play();
      if (activeTrackIndex >= 0 && activePlaylist[activeTrackIndex]) {
        nowPlaying.textContent = "Playing: " + activePlaylist[activeTrackIndex].name;
      }
    } else {
      audio.pause();
      if (activeTrackIndex >= 0 && activePlaylist[activeTrackIndex]) {
        nowPlaying.textContent = "Paused: " + activePlaylist[activeTrackIndex].name;
      }
    }
  } else if (selectedFolderNode && selectedFolderNode.files.length > 0) {
    activePlaylist = selectedFolderNode.files;
    playTrackFromPlaylist(0);
  } else if (folderStack.length > 0 && folderStack[0].files.length > 0) {
    activePlaylist = folderStack[0].files;
    playTrackFromPlaylist(0);
  }
};

recordBtn.onclick = async () => {
  if (mediaRecorder && mediaRecorder.state === "recording") {
    mediaRecorder.stop();
    return;
  }

 let targetFolder = selectedFolderNode || folderStack[0];
  if (!targetFolder) {
    if (!defaultVoiceFolderHandle) {
      if (!window.showDirectoryPicker) {
        alert("Direct folder access requires Vivaldi, Chrome, Edge, or Brave.");
        return;
      }
      try {
        defaultVoiceFolderHandle = await window.showDirectoryPicker({ mode: "readwrite" });
      } catch (err) {
        if (err.name !== "AbortError") {
          alert("Could not select folder to save recording: " + err.message);
        }
        return;
      }
    }
    targetFolder = {
      name: defaultVoiceFolderHandle.name,
      handle: defaultVoiceFolderHandle,
      parentNode: null
    };
  }

  try {
    if (!audio.paused) {
      audio.pause();
    }

    recordingStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mimeType = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
      ? "audio/webm;codecs=opus"
      : (MediaRecorder.isTypeSupported("audio/ogg;codecs=opus") ? "audio/ogg;codecs=opus" : "");

    mediaRecorder = mimeType
      ? new MediaRecorder(recordingStream, { mimeType })
      : new MediaRecorder(recordingStream);

    recordedChunks = [];
    recSeconds = 0;

    mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) recordedChunks.push(e.data);
    };

    mediaRecorder.onstop = async () => {
      clearInterval(recTimerInterval);
      recordBtn.classList.remove("btn-recording");
      recordBtn.innerHTML = "🎙 Record";

      if (recordingStream) {
        recordingStream.getTracks().forEach((t) => t.stop());
        recordingStream = null;
      }

      const ext = (mediaRecorder.mimeType || "").includes("ogg") ? "ogg" : "webm";
      const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || "audio/webm" });

      const now = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      const filename = `Voice_${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}_${pad(now.getHours())}-${pad(now.getMinutes())}-${pad(now.getSeconds())}.${ext}`;

      try {
        const fileHandle = await targetFolder.handle.getFileHandle(filename, { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(blob);
        await writable.close();

        voiceStack.unshift({
          name: filename,
          handle: fileHandle,
          parentNode: targetFolder
        });

        renderUnifiedTree();
        nowPlaying.textContent = `Saved: ${filename}`;
      } catch (saveErr) {
        alert("Could not save voice recording: " + saveErr.message);
      }
    };

    mediaRecorder.start();
    recordBtn.classList.add("btn-recording");
    recordBtn.innerHTML = "⏹ Save 00:00";
    nowPlaying.textContent = "Recording from microphone...";

    recTimerInterval = setInterval(() => {
      recSeconds++;
      recordBtn.innerHTML = `⏹ Save ${formatTime(recSeconds)}`;
    }, 1000);
  } catch (err) {
    alert("Microphone access denied or unavailable: " + err.message);
  }
};
document.getElementById("stopBtn").onclick = stopPlayback;

document.getElementById("prevBtn").onclick = () => {
  if (activePlaylist.length === 0) return;
  const prev = activeTrackIndex > 0 ? activeTrackIndex - 1 : activePlaylist.length - 1;
  playTrackFromPlaylist(prev);
};

document.getElementById("nextBtn").onclick = () => {
  if (activePlaylist.length === 0) return;
  const next = (activeTrackIndex + 1) % activePlaylist.length;
  playTrackFromPlaylist(next);
};

let playAllFolders = false;
const playModeBtn = document.getElementById("playModeBtn");
if (playModeBtn) {
  playModeBtn.onclick = () => {
    playAllFolders = !playAllFolders;
    playModeBtn.textContent = playAllFolders ? "🔁 Play All" : "📁 Play Folder";
    playModeBtn.style.borderColor = playAllFolders ? "#facc15" : "";
  };
}

function collectPlayablePlaylists() {
  const lists = [];
  if (typeof voiceStack !== "undefined" && voiceStack.length > 0) {
    lists.push({ node: null, files: voiceStack });
  }
  function walk(node) {
    if (!node) return;
    if (Array.isArray(node.files) && node.files.length > 0) {
      lists.push({ node, files: node.files });
    }
    if (Array.isArray(node.subfolders)) {
      node.subfolders.forEach(walk);
    }
  }
  if (typeof folderStack !== "undefined") {
    folderStack.forEach(walk);
  }
  return lists;
}

audio.addEventListener("ended", () => {
  if (activeTrackIndex + 1 < activePlaylist.length) {
    playTrackFromPlaylist(activeTrackIndex + 1);
    return;
  }
  if (playAllFolders) {
    const allLists = collectPlayablePlaylists();
    const currentListIdx = allLists.findIndex((item) => item.files === activePlaylist);
    if (currentListIdx >= 0 && currentListIdx + 1 < allLists.length) {
      const nextEntry = allLists[currentListIdx + 1];
      if (nextEntry.node) selectedFolderNode = nextEntry.node;
      activePlaylist = nextEntry.files;
      playTrackFromPlaylist(0);
      return;
    }
  }
  stopPlayback();
});

function formatTime(sec) {
  if (!isFinite(sec)) return "00:00";
  const m = Math.floor(sec / 60).toString().padStart(2, "0");
  const s = Math.floor(sec % 60).toString().padStart(2, "0");
  return `${m}:${s}`;
}

audio.addEventListener("timeupdate", () => {
  if (audio.duration) {
    seekBar.value = (audio.currentTime / audio.duration) * 100;
    currentTimeEl.textContent = formatTime(audio.currentTime);
    totalTimeEl.textContent = formatTime(audio.duration);
  }
});

seekBar.addEventListener("input", () => {
  if (audio.duration) {
    audio.currentTime = (seekBar.value / 100) * audio.duration;
  }
});

(function() {

    }

        pickDirectory: (opts) => cap.nativePromise("AndroidFS", "pickDirectory", opts || {}),
        listEntries: (opts) => cap.nativePromise("AndroidFS", "listEntries", opts || {}),
        readFileBase64: (opts) => cap.nativePromise("AndroidFS", "readFileBase64", opts || {}),
        writeFileBase64: (opts) => cap.nativePromise("AndroidFS", "writeFileBase64", opts || {}),

  function base64ToUint8Array(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);

    return {
      kind: "directory",

          _uri: "",

              async close() {
                const plugin = getPlugin();

                  dirHandleId: handleId,
                  fileName: fileName,
                  mimeType: "audio/webm",
                  base64Data: b64

                fileHandleRef._handleId = res.handleId;
                fileHandleRef._uri = res.uri || "";
              }

          }

        return fileHandleRef;
      },
      async removeEntry(entryName) {
        const plugin = getPlugin();
        const res = await plugin.removeEntry({ dirHandleId: handleId, entryName });

      }
    };
  }

    const plugin = getPlugin();
    if (!plugin) throw new Error("AndroidFS plugin unavailable");
    try {
      const res = await plugin.pickDirectory();
      return makeAndroidDirHandle(res.handleId, res.name, res.uri);
    } catch (e) {
      const err = new Error((e && e.message) || "Canceled");
      if (err.message === "Canceled") err.name = "AbortError";

// --- Native Android MediaPlayer Bridge (Zero-RAM streaming for multi-hour audiobooks) ---
(function() {
  if (!/Android/i.test(navigator.userAgent)) return;

  let nativeActive = false;
  let nativePlaying = false;
  let nativeDurationSec = 0;
  let nativeCurrentSec = 0;
  let statusTimer = null;

  function getFS() {
    const cap = window.Capacitor;
    if (!cap) return null;
    if (cap.Plugins && cap.Plugins.AndroidFS) return cap.Plugins.AndroidFS;
    if (typeof cap.registerPlugin === "function") return cap.registerPlugin("AndroidFS");
    return null;
  }

  function startStatusPoll() {
    if (statusTimer) return;
    statusTimer = setInterval(async () => {
      if (!nativeActive) return;
      const fs = getFS();
      if (!fs || typeof fs.getNativeStatus !== "function") return;
      try {
        const st = await fs.getNativeStatus();
        nativePlaying = !!(st && st.playing);
        nativeCurrentSec = ((st && st.currentMs) || 0) / 1000;
        nativeDurationSec = ((st && st.durationMs) || 0) / 1000;
        playPauseBtn.innerHTML = nativePlaying ? "⏸ Pause" : "▶ Start";
        if (nativeDurationSec > 0) {
          seekBar.value = (nativeCurrentSec / nativeDurationSec) * 100;
          currentTimeEl.textContent = formatTime(nativeCurrentSec);
          totalTimeEl.textContent = formatTime(nativeDurationSec);
        }
      } catch (_) {}
    }, 500);
  }

  const fsInit = getFS();
  if (fsInit && typeof fsInit.addListener === "function") {
    fsInit.addListener("nativeEnded", () => {
      nativePlaying = false;
      playPauseBtn.innerHTML = "▶ Start";
      if (activeTrackIndex + 1 < activePlaylist.length) {
        window.playTrackFromPlaylist(activeTrackIndex + 1);
      } else if (typeof playAllFolders !== "undefined" && playAllFolders && typeof collectPlayablePlaylists === "function") {
        const allLists = collectPlayablePlaylists();
        const currentListIdx = allLists.findIndex((item) => item.files === activePlaylist);
        if (currentListIdx >= 0 && currentListIdx + 1 < allLists.length) {
          const nextEntry = allLists[currentListIdx + 1];
          if (nextEntry.node) selectedFolderNode = nextEntry.node;
          activePlaylist = nextEntry.files;
          window.playTrackFromPlaylist(0);
        } else {
          window.stopPlayback();
        }
      } else {
        window.stopPlayback();
      }
    });
  }

  window.playTrackFromPlaylist = async function(idx, startAtSec = 0) {
    if (idx < 0 || idx >= activePlaylist.length) return;
    activeTrackIndex = idx;
    const track = activePlaylist[idx];
    activeTrackHandle = track.handle;
    const fs = getFS();
    if (fs && typeof fs.playNative === "function" && (track.handle._handleId || track.handle._uri)) {
      try {
        const res = await fs.playNative({
          handleId: track.handle._handleId || "",
          uri: track.handle._uri || "",
          startMs: Math.floor((startAtSec || 0) * 1000)
        });
        nativeActive = true;
        nativePlaying = true;
        nativeDurationSec = ((res && res.durationMs) || 0) / 1000;
        nativeCurrentSec = startAtSec || 0;
        playPauseBtn.innerHTML = "⏸ Pause";
        totalTimeEl.textContent = formatTime(nativeDurationSec);
        currentTimeEl.textContent = formatTime(nativeCurrentSec);
        nowPlaying.textContent = "Playing: " + track.name;
        renderUnifiedTree();
        startStatusPoll();
        return;
      } catch (err) {
        alert("Playback error: " + (err && err.message ? err.message : err));
        return;
      }
    }
  };

  playPauseBtn.onclick = async () => {
    const fs = getFS();
    if (nativeActive && fs) {
      if (nativePlaying) {
        await fs.pauseNative();
        nativePlaying = false;
        playPauseBtn.innerHTML = "▶ Start";
        if (activeTrackIndex >= 0 && activePlaylist[activeTrackIndex]) {
          nowPlaying.textContent = "Paused: " + activePlaylist[activeTrackIndex].name;
        }
      } else {
        await fs.resumeNative();
        nativePlaying = true;
        playPauseBtn.innerHTML = "⏸ Pause";
        if (activeTrackIndex >= 0 && activePlaylist[activeTrackIndex]) {
          nowPlaying.textContent = "Playing: " + activePlaylist[activeTrackIndex].name;
        }
      }
    } else if (selectedFolderNode && selectedFolderNode.files.length > 0) {
      activePlaylist = selectedFolderNode.files;
      window.playTrackFromPlaylist(0);
    } else if (folderStack.length > 0 && folderStack[0].files.length > 0) {
      activePlaylist = folderStack[0].files;
      window.playTrackFromPlaylist(0);
    }
  };

  window.stopPlayback = async function() {
    const fs = getFS();
    if (nativeActive && fs) {
      await fs.stopNative();
      nativePlaying = false;
      nativeCurrentSec = 0;
    }
    seekBar.value = 0;
    currentTimeEl.textContent = "00:00";
    playPauseBtn.innerHTML = "▶ Start";
    if (activeTrackIndex >= 0 && activePlaylist[activeTrackIndex]) {
      nowPlaying.textContent = "Stopped: " + activePlaylist[activeTrackIndex].name;
    }
  };
  document.getElementById("stopBtn").onclick = window.stopPlayback;

  seekBar.addEventListener("input", async () => {
    const fs = getFS();
    if (nativeActive && fs && nativeDurationSec > 0) {
      const targetSec = (seekBar.value / 100) * nativeDurationSec;
      nativeCurrentSec = targetSec;
      currentTimeEl.textContent = formatTime(targetSec);
      await fs.seekNative({ positionMs: Math.floor(targetSec * 1000) });
    }
  });

  window.getGloryCurrentSec = () => nativeActive ? nativeCurrentSec : (audio.currentTime || 0);
  // Expose nativeCurrentSec to bookmark button
  Object.defineProperty(audio, "currentTime", {
    get() { return nativeActive ? nativeCurrentSec : 0; },
    set(v) { nativeCurrentSec = v; }
  });
  Object.defineProperty(audio, "paused", {
    get() { return !nativePlaying; }
  });
})();
